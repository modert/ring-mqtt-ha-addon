name: Ring-MQTT with Video Streaming (Shared Account Fix)
version: "5.9.3-fix.5"
slug: ring_mqtt
description: Ring Devices via MQTT/RTSP, patched so shared accounts with an empty ring_devices response still discover alarm devices
startup: application
boot: auto
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
url: 'https://github.com/modert/ring-mqtt-ha-addon'
webui: 'http://[HOST]:[PORT:55123]/'
ingress: true
ingress_port: 55123
services:
  - 'mqtt:need'
map:
  - ssl
watchdog: 'http://[HOST]:[PORT:55123]/'
ports:
  8554/tcp: null
ports_description:
  8554/tcp: 'RTSP Server External Port (IMPORTANT: Only needed to allow RTSP clients outside of Home Assistant, configure livestream username/password before enabling!)'
init: false
video: true
options:
  mqtt_url: 'mqtt://auto_username:auto_password@auto_hostname'
  mqtt_options: ''
  livestream_user: ''
  livestream_pass: ''
  disarm_code: ''
  enable_cameras: true
  enable_modes: false
  enable_panic: false
  debug: ring-*
  location_ids: []
  token_import: ''
schema:
  mqtt_url: url
  mqtt_options: str
  livestream_user: str
  livestream_pass: password
  disarm_code: password
  enable_cameras: bool
  enable_modes: bool
  enable_panic: bool
  debug: str
  location_ids:
    - str
  token_import: password
